[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "feng497"
version = "0.1.0"
description = "ML models for steel plate stress and UD composite first-ply failure loads"
readme = "README.md"
requires-python = ">=3.9,<3.13"
dynamic = ["dependencies"]

[project.scripts]
feng497 = "feng497.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}
